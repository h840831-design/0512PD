<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實習學生電子學習歷程實作工作坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .emerald-gradient { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .progress-bar-fill { transition: width 0.5s ease-out; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="emerald-gradient text-white pt-16 pb-24 px-6 relative overflow-hidden transition-all duration-500" id="header-bg">
        <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
            <!-- Decorative background elements -->
            <div class="absolute w-64 h-64 bg-white rounded-full mix-blend-overlay filter blur-3xl -top-20 -left-20"></div>
            <div class="absolute w-96 h-96 bg-white rounded-full mix-blend-overlay filter blur-3xl bottom-[-10%] right-[-10%]"></div>
        </div>
        
        <div class="max-w-4xl mx-auto relative z-10 text-center">
            <div class="inline-block bg-white/20 text-emerald-50 px-4 py-1.5 rounded-full text-sm font-bold tracking-wider mb-6 border border-emerald-300/30">
                <i class="fa-solid fa-award mr-2"></i>CFD 進階學分認證課程
            </div>
            <h1 class="text-4xl md:text-5xl font-black mb-4 leading-tight">實習學生電子學習歷程<br><span class="text-emerald-200">實作工作坊</span></h1>
            <p class="text-emerald-50 text-lg md:text-xl font-medium mb-2">指定對象：各組第一教師及第二教師</p>
            <p class="text-emerald-100/80 text-sm"><i class="fa-solid fa-location-dot mr-1"></i> 教學中心實作教室</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 -mt-16 relative z-20 pb-20">
        
        <!-- Info Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10" id="info-cards">
            <div class="bg-white rounded-2xl p-6 shadow-lg shadow-slate-200/50 text-center border border-slate-100">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                    <i class="fa-solid fa-laptop-slash"></i>
                </div>
                <h3 class="font-bold text-slate-800 mb-1">不須帶電腦</h3>
                <p class="text-sm text-slate-500">現場已為您備妥設備</p>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-lg shadow-slate-200/50 text-center border border-slate-100">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <h3 class="font-bold text-slate-800 mb-1">空手即可參加</h3>
                <p class="text-sm text-slate-500">提供完整範本不須準備資料</p>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-lg shadow-slate-200/50 text-center border border-slate-100">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <h3 class="font-bold text-slate-800 mb-1">精簡高效率</h3>
                <p class="text-sm text-slate-500">1 小時完成實作演練</p>
            </div>
        </div>

        <!-- Success Message (Hidden by default) -->
        <div id="success-msg" class="hidden bg-emerald-50 border border-emerald-200 rounded-3xl p-10 text-center shadow-lg shadow-emerald-100/50 mt-10">
            <div class="w-20 h-20 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-md shadow-emerald-500/30">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="text-2xl font-bold text-emerald-800 mb-2">報名成功！資料已同步至試算表</h2>
            <p class="text-emerald-600 mb-6">我們已收到您的報名資料，期待您的參與。<br>若需更改，請聯繫教學中心分機。</p>
            <button onclick="location.reload()" class="bg-white text-emerald-600 font-bold py-2 px-6 rounded-full border border-emerald-200 hover:bg-emerald-50 transition-colors">
                返回首頁
            </button>
        </div>

        <!-- Session Selection -->
        <div id="selection-container">
            <h2 class="text-xl font-bold text-slate-800 mb-4 px-2"><i class="fa-solid fa-calendar-check text-emerald-500 mr-2"></i>請選擇報名場次</h2>
            <div class="grid md:grid-cols-2 gap-6">
                
                <!-- Session 1 -->
                <div class="bg-white rounded-3xl p-1 shadow-lg shadow-slate-200/50 border border-slate-100 transition-transform hover:-translate-y-1">
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">第一場次</h3>
                                <p class="text-emerald-600 font-bold text-xl mt-1">6/12 <span class="text-sm font-normal text-slate-500">(三)</span> 16:00-17:00</p>
                            </div>
                            <span class="bg-slate-100 text-slate-600 text-xs px-3 py-1 rounded-full font-medium"><i class="fa-solid fa-users mr-1"></i>限額12名</span>
                        </div>
                        
                        <div class="mb-5">
                            <div class="flex justify-between text-sm mb-1.5">
                                <span class="text-slate-500 font-medium">報名進度</span>
                                <span class="text-slate-700 font-bold" id="count-1">讀取中...</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                <div class="bg-emerald-500 h-2.5 rounded-full progress-bar-fill w-0" id="bar-1"></div>
                            </div>
                        </div>

                        <button id="btn-session-1" onclick="selectSession('2024-06-12', 1)" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 px-4 rounded-xl transition-colors flex justify-center items-center gap-2">
                            選擇此場次 <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Session 2 -->
                <div class="bg-white rounded-3xl p-1 shadow-lg shadow-slate-200/50 border border-slate-100 transition-transform hover:-translate-y-1">
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">第二場次</h3>
                                <p class="text-emerald-600 font-bold text-xl mt-1">6/18 <span class="text-sm font-normal text-slate-500">(二)</span> 16:00-17:00</p>
                            </div>
                            <span class="bg-slate-100 text-slate-600 text-xs px-3 py-1 rounded-full font-medium"><i class="fa-solid fa-users mr-1"></i>限額12名</span>
                        </div>
                        
                        <div class="mb-5">
                            <div class="flex justify-between text-sm mb-1.5">
                                <span class="text-slate-500 font-medium">報名進度</span>
                                <span class="text-slate-700 font-bold" id="count-2">讀取中...</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                <div class="bg-emerald-500 h-2.5 rounded-full progress-bar-fill w-0" id="bar-2"></div>
                            </div>
                        </div>

                        <button id="btn-session-2" onclick="selectSession('2024-06-18', 2)" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 px-4 rounded-xl transition-colors flex justify-center items-center gap-2">
                            選擇此場次 <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Registration Form (Hidden by default) -->
        <div id="form-container" class="hidden mt-8 bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-8 py-5 border-b border-slate-200 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">填寫報名資料</h2>
                    <p class="text-emerald-600 font-bold mt-1 text-sm">已選擇：<span id="selected-session-display" class="bg-emerald-100 px-2 py-0.5 rounded text-emerald-800 ml-1"></span></p>
                </div>
                <button onclick="cancelRegistration()" class="text-slate-400 hover:text-slate-600 w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-200 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="p-8">
                <!-- Custom Error Alert -->
                <div id="form-error" class="hidden mb-6 bg-red-50 text-red-600 px-4 py-3 rounded-xl border border-red-200 flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="error-message">錯誤訊息</span>
                </div>

                <form id="regForm" class="space-y-6">
                    <input type="hidden" id="selected-session-input">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Unit -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">單位 (組別) <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-building-user"></i>
                                </div>
                                <input type="text" id="unit" required placeholder="例如：內科部教學組" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none text-slate-700">
                            </div>
                        </div>

                        <!-- Name -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">姓名 <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <input type="text" id="name" required placeholder="請輸入姓名" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none text-slate-700">
                            </div>
                        </div>

                        <!-- Staff ID -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">人事號 <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-id-card"></i>
                                </div>
                                <input type="text" id="staffId" required placeholder="用於登錄CFD學分" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none text-slate-700">
                            </div>
                        </div>

                        <!-- Extension -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">聯絡分機 <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-phone"></i>
                                </div>
                                <input type="text" id="extension" required placeholder="例如：5678" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none text-slate-700">
                            </div>
                        </div>
                    </div>

                    <!-- Email (Full width) -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">電子郵件 <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <input type="email" id="email" required placeholder="寄送行前通知用" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none text-slate-700">
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-lg py-4 px-6 rounded-xl transition-all shadow-lg shadow-emerald-600/30 flex justify-center items-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i> 確認送出報名
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

<!-- Firebase & Logic Integration -->
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // UI Utilities
    window.selectSession = (dateStr, btnNum) => {
        document.getElementById('selected-session-input').value = dateStr;
        document.getElementById('selected-session-display').innerText = dateStr;
        
        document.getElementById('selection-container').classList.add('hidden');
        document.getElementById('info-cards').classList.add('hidden');
        
        // Adjust Header height for better form focus
        document.getElementById('header-bg').classList.remove('pb-24');
        document.getElementById('header-bg').classList.add('pb-12');
        
        const formContainer = document.getElementById('form-container');
        formContainer.classList.remove('hidden');
        
        window.scrollTo({ top: formContainer.offsetTop - 50, behavior: 'smooth' });
    };

    window.cancelRegistration = () => {
        document.getElementById('form-container').classList.add('hidden');
        document.getElementById('selection-container').classList.remove('hidden');
        document.getElementById('info-cards').classList.remove('hidden');
        
        document.getElementById('header-bg').classList.add('pb-24');
        document.getElementById('header-bg').classList.remove('pb-12');
        
        // Hide errors
        document.getElementById('form-error').classList.add('hidden');
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    const showError = (msg) => {
        const errDiv = document.getElementById('form-error');
        document.getElementById('error-message').innerText = msg;
        errDiv.classList.remove('hidden');
    }

    // Firebase Setup & State Management
    let db, auth;
    const CAPACITY = 12;
    let currentRegistrations = []; // 存放所有報名資料
    let isFirebaseActive = false;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    
    // 將這裡替換成您最新的 GAS 網址
    const gasUrl = "https://script.google.com/macros/s/AKfycbxZ8nJ1Lep5O04kBZc8DAQ2y7tdMTpi9FjxfZk33WLWQFJjiNpGqZXugzEVueDsMI6I/exec";

    // 嘗試初始化 Firebase
    try {
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            isFirebaseActive = true;
        } else {
             console.log("Operating in Local Demo Mode (No Firebase Config).");
        }
    } catch (e) {
        console.log("Operating in Local Demo Mode (Firebase init failed).");
    }

    // 新增：向 GAS 抓取試算表的真實報名人數
    const fetchRealDataCount = async () => {
        try {
            // 使用 GET 請求向 GAS 取得人數
            const response = await fetch(gasUrl);
            const counts = await response.json();
            
            // 將 GAS 回傳的人數更新到本地陣列，讓畫面可以正確顯示
            currentRegistrations = [];
            
            // 塞入 6/12 的人數
            for(let i=0; i < counts["session_2024_06_12"]; i++){
                currentRegistrations.push({ session: '2024-06-12' });
            }
            
            // 塞入 6/18 的人數
            for(let i=0; i < counts["session_2024_06_18"]; i++){
                currentRegistrations.push({ session: '2024-06-18' });
            }
            
            updateUI();
        } catch (error) {
            console.error("無法取得試算表真實人數:", error);
            // 萬一抓不到，至少讓畫面先顯示 0
            document.getElementById('count-1').innerText = `0 / ${CAPACITY}`;
            document.getElementById('count-2').innerText = `0 / ${CAPACITY}`;
        }
    };

    const startApp = async () => {
        if (isFirebaseActive && auth) {
             // --- 雲端模式 (Firebase) ---
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
            }

            onAuthStateChanged(auth, (user) => {
                if (!user) return;
                const regsRef = collection(db, 'artifacts', appId, 'public', 'data', 'registrations');
                onSnapshot(regsRef, (snapshot) => {
                    currentRegistrations = [];
                    snapshot.forEach(doc => currentRegistrations.push(doc.data()));
                    updateUI();
                }, (error) => {
                    console.error("Snapshot error:", error);
                });
            });
        } else {
            // --- 無 Firebase 模式 ---
            // 改為去 GAS 抓取試算表的真實人數，而不是塞假資料
            fetchRealDataCount();
        }
    };

    const updateUI = () => {
        const count1 = currentRegistrations.filter(r => r.session === '2024-06-12').length;
        const count2 = currentRegistrations.filter(r => r.session === '2024-06-18').length;

        // Session 1 Update
        document.getElementById('count-1').innerText = `${count1} / ${CAPACITY}`;
        document.getElementById('bar-1').style.width = `${(count1 / CAPACITY) * 100}%`;
        const btn1 = document.getElementById('btn-session-1');
        if (count1 >= CAPACITY) {
            btn1.disabled = true;
            btn1.innerHTML = '<i class="fa-solid fa-lock"></i> 該場次已額滿';
            btn1.classList.replace('bg-slate-800', 'bg-slate-300');
            btn1.classList.replace('hover:bg-slate-700', 'hover:bg-slate-300');
            btn1.classList.remove('text-white');
            btn1.classList.add('text-slate-500');
        }

        // Session 2 Update
        document.getElementById('count-2').innerText = `${count2} / ${CAPACITY}`;
        document.getElementById('bar-2').style.width = `${(count2 / CAPACITY) * 100}%`;
        const btn2 = document.getElementById('btn-session-2');
        if (count2 >= CAPACITY) {
            btn2.disabled = true;
            btn2.innerHTML = '<i class="fa-solid fa-lock"></i> 該場次已額滿';
            btn2.classList.replace('bg-slate-800', 'bg-slate-300');
            btn2.classList.replace('hover:bg-slate-700', 'hover:bg-slate-300');
            btn2.classList.remove('text-white');
            btn2.classList.add('text-slate-500');
        }
    };

    // Form Submit Handler
    document.getElementById('regForm').onsubmit = async (e) => {
        e.preventDefault();
        
        // Hide previous errors
        document.getElementById('form-error').classList.add('hidden');
        
        const session = document.getElementById('selected-session-input').value;
        const submitBtn = document.getElementById('submitBtn');
        
        // Final capacity check
        const count = currentRegistrations.filter(r => r.session === session).length;
        if (count >= CAPACITY) {
            showError("很抱歉，在您填寫資料期間，該場次已額滿！");
            return;
        }

        // Lock button during submission
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 處理中...';
        submitBtn.classList.replace('bg-emerald-600', 'bg-emerald-400');

        try {
            // 1. Prepare Data
            const formData = {
                unit: document.getElementById('unit').value.trim(),
                name: document.getElementById('name').value.trim(),
                staffId: document.getElementById('staffId').value.trim(),
                extension: document.getElementById('extension').value.trim(),
                email: document.getElementById('email').value.trim(),
                session: session
            };

            // 2. Save to Google Apps Script (Your Google Sheet)
            fetch(gasUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(formData)
            }).catch(err => console.error("GAS warning:", err));

            // 3. Save to Firebase OR Update Local State
            if (isFirebaseActive && auth && db) {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'registrations'), {
                    ...formData,
                    timestamp: serverTimestamp()
                });
            } else {
                // 本地預覽模式：手動將新報名加入陣列並更新畫面
                currentRegistrations.push(formData);
                updateUI();
            }

            // 4. Show Success UI
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('success-msg').classList.remove('hidden');
            
            // Adjust header again
            document.getElementById('header-bg').classList.add('pb-12');
            window.scrollTo({ top: 0, behavior: 'smooth' });

        } catch (error) {
            console.error("Submit error:", error);
            showError("系統發生錯誤，請稍後再試或聯繫分機。");
            
            // Reset button
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 確認送出報名';
            submitBtn.classList.replace('bg-emerald-400', 'bg-emerald-600');
        }
    };

    // Initialize
    startApp();

</script>
</body>
</html>
